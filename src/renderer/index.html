<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Client</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-deep':     '#0a0a14',
            'bg-base':     '#0d0d18',
            'bg-panel':    '#14141f',
            'bg-raised':   '#1a1a28',
            'border-dim':  '#1f1f30',
            'border-lit':  '#2a2a42',
            'text-hi':     '#f0f0f8',
            'text-lo':     '#8a8aa8',
            'text-dim':    '#5a5a78',
            'brand':       '#ff3b3b',
            'brand-hi':    '#ff5555',
            'brand-dark':  '#b91c1c',
            'accent':      '#3b82f6',
            'accent-hi':   '#60a5fa',
            'accent-dark': '#1d4ed8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bg-base text-text-hi overflow-hidden">

  <!-- Titlebar -->
  <div class="titlebar absolute top-0 left-0 right-0 h-9 bg-bg-deep/95 backdrop-blur border-b border-border-dim flex justify-between items-center px-3 z-50">
    <div class="flex items-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-gradient-to-r from-brand to-accent shadow-[0_0_8px_rgba(255,59,59,0.8)]"></span>
      <span class="text-xs font-bold tracking-wide text-text-hi">PRO CLIENT</span>
    </div>
    <div class="flex gap-0.5">
      <button id="min" class="w-8 h-7 rounded hover:bg-bg-raised text-text-lo text-sm">—</button>
      <button id="max" class="w-8 h-7 rounded hover:bg-bg-raised text-text-lo text-sm">▢</button>
      <button id="close" class="w-8 h-7 rounded hover:bg-brand text-text-lo hover:text-white text-sm">✕</button>
    </div>
  </div>

  <!-- App shell -->
  <div class="pt-9 h-screen flex">

    <!-- Icon rail -->
    <aside class="rail w-[80px] flex flex-col items-center py-3">

      <button data-tab="home" class="rail-btn active">
        <span class="rail-icon">🏠</span>
        <span>Home</span>
      </button>

      <button data-tab="content" class="rail-btn">
        <span class="rail-icon">🧩</span>
        <span>Content</span>
      </button>

      <button data-tab="skins" class="rail-btn">
        <span class="rail-icon">👤</span>
        <span>Skins</span>
      </button>

      <button data-tab="settings" class="rail-btn">
        <span class="rail-icon">⚙️</span>
        <span>Config</span>
      </button>

      <div class="flex-1"></div>

      <button id="open-account-modal" class="rail-btn" title="Accounts">
        <span class="rail-icon">👥</span>
        <span id="rail-username">Player</span>
      </button>

      <div class="rail-btn" style="pointer-events:none;">
        <span class="rail-icon" style="color:#22c55e; font-size:14px;">●</span>
        <span class="text-text-dim">Online</span>
      </div>
      <div class="text-[10px] text-text-dim pb-2 tracking-wider">v1.1.4</div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-hidden">

      <!-- HOME TAB -->
      <section id="home" class="tab h-full overflow-y-auto p-8">
        <div class="mb-8">
          <h1 class="text-3xl font-bold tracking-tight">Welcome back</h1>
          <p class="text-text-lo mt-1 text-sm">Ready to jump into your next world?</p>
        </div>

        <!-- Play panel -->
        <div class="glass rounded-2xl p-6 mb-8 flex items-center gap-6">
          <div class="w-20 h-20 rounded-xl bg-gradient-to-br from-brand via-brand to-accent flex items-center justify-center text-4xl shadow-[0_0_30px_rgba(255,59,59,0.4)]">
            ⛏️
          </div>
          <div class="flex-1">
            <h2 class="text-xl font-bold">Minecraft</h2>
            <p class="text-text-lo text-sm mt-0.5">Latest Release • <span id="home-version">Loading...</span></p>
          </div>
          <div class="flex gap-2 items-center">
            <select id="version-select"
                    class="px-4 py-3 bg-bg-raised/80 rounded-xl border border-border-dim text-text-hi focus:border-brand outline-none text-sm">
              <option value="">Loading versions...</option>
            </select>
            <button id="play" class="px-8 py-3 bg-gradient-to
