      <!-- CONTENT HUB TAB (Lunar Explore style) -->
      <section id="content" class="tab hidden h-full flex flex-col">

        <!-- Top bar: big search + filters -->
        <div class="px-8 pt-6 pb-4 border-b border-border-dim">
          <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-dim">🔍</span>
              <input id="content-query" 
                     placeholder="Search mods, modpacks, resource packs..."
                     class="w-full pl-11 pr-4 py-3 bg-bg-raised/80 rounded-xl border border-border-dim text-text-hi focus:border-brand outline-none text-sm" />
            </div>
            <button id="content-search-btn"
                    class="px-8 py-3 bg-brand rounded-xl font-bold text-white hover:bg-brand-hi transition text-sm">
              Search
            </button>
          </div>

          <!-- Filter row -->
          <div class="flex items-center gap-2">
            <span class="text-xs text-text-dim mr-1">Filter:</span>
            <select id="content-version"
                    class="px-3 py-1.5 bg-bg-raised/60 rounded-lg border border-border-dim text-text-hi text-xs outline-none hover:border-brand/40">
              <option value="1.21.4">1.21.4</option>
              <option value="1.21.1">1.21.1</option>
              <option value="1.20.6">1.20.6</option>
              <option value="1.20.4">1.20.4</option>
              <option value="1.19.4">1.19.4</option>
              <option value="1.18.2">1.18.2</option>
              <option value="1.16.5">1.16.5</option>
              <option value="1.12.2">1.12.2</option>
              <option value="1.8.9">1.8.9</option>
            </select>
            <select id="content-loader"
                    class="px-3 py-1.5 bg-bg-raised/60 rounded-lg border border-border-dim text-text-hi text-xs outline-none hover:border-brand/40">
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
              <option value="quilt">Quilt</option>
              <option value="neoforge">NeoForge</option>
            </select>
            <div class="flex-1"></div>
            <span id="content-count" class="text-xs text-text-dim"></span>
          </div>
        </div>

        <!-- Content type tabs -->
        <div class="flex gap-1 px-8 pt-4">
          <button class="content-type-tab active" data-type="modpack">
            📦 Modpacks
          </button>
          <button class="content-type-tab" data-type="mod">
            🧩 Mods
          </button>
          <button class="content-type-tab" data-type="resourcepack">
            🎨 Resource Packs
          </button>
          <button class="content-type-tab" data-type="datapack">
            🗂️ Data Packs
          </button>
        </div>

        <!-- Results -->
        <div class="flex-1 overflow-y-auto px-8 py-6">
          <div id="content-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Empty state -->
            <div class="col-span-full text-center py-20">
              <div class="text-5xl mb-4">🔎</div>
              <p class="text-text-lo text-sm">Search for content to install</p>
              <p class="text-text-dim text-xs mt-2">Powered by Modrinth</p>
            </div>
          </div>
        </div>
      </section>
