<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Pro Client</title>
</head>
<body>
  <div class="titlebar">
    <div class="title">
      <span class="pro">Pro</span> <span class="client">Client</span>
    </div>
    <div class="controls">
      <button id="min">—</button>
      <button id="max">▢</button>
      <button id="close">✕</button>
    </div>
  </div>

  <div class="sidebar">
    <button data-tab="home" class="active">Home</button>
    <button data-tab="mods">Mods</button>
    <button data-tab="modpacks">Modpacks</button>
    <button data-tab="resourcepacks">Resource Packs</button>
    <button data-tab="settings">Settings</button>
  </div>

  <main class="content">
    <section id="home" class="tab active">
      <h1><span class="pro">Pro</span> <span class="client">Client</span></h1>
      <p>Select a version and hit Play.</p>
      <button class="play-btn" id="play">▶ PLAY</button>
    </section>
    <section id="mods" class="tab"><h2>Mods</h2><p>Modrinth / CurseForge browser coming soon.</p></section>
    <section id="modpacks" class="tab"><h2>Modpacks</h2><p>Modpack browser coming soon.</p></section>
    <section id="resourcepacks" class="tab"><h2>Resource Packs</h2><p>PacksMC integration coming soon.</p></section>
    <section id="settings" class="tab"><h2>Settings</h2></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
